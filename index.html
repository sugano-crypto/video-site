<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>すがコンサルティング＆パートナーズ｜会員サイト</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --navy: #1a3a5c;
  --navy-dark: #102640;
  --navy-mid: #2a5298;
  --sky: #4a90d9;
  --sky-light: #e8f4fd;
  --white: #ffffff;
  --gray-100: #f5f8fc;
  --gray-200: #e8eef5;
  --gray-400: #8fa3b8;
  --gray-600: #4a6280;
  --text: #1e3450;
}

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--gray-100);
  color: var(--text);
  min-height: 100vh;
}

.auth-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 40px 24px;
  background: linear-gradient(145deg,#eaf3fb 0%,#f5f8fc 50%,#e8f0f8 100%);
  overflow-y: auto;
}

.auth-screen.active {
  display: flex;
}

.auth-card {
  background: var(--white);
  border-radius: 16px;
  padding: 48px 44px 44px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 4px 24px rgba(26,58,92,.10);
}

.brand {
  text-align: center;
  margin-bottom: 36px;
}

.brand img {
  width: 110px;
  height: 110px;
  object-fit: contain;
  margin-bottom: 10px;
}

.brand-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: .03em;
  line-height: 1.5;
}

.brand-sub {
  font-size: 12px;
  color: var(--gray-400);
  margin-top: 4px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--gray-600);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 11px 14px;
  background: var(--gray-100);
  border: 1.5px solid var(--gray-200);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
}

.form-group input:focus {
  border-color: var(--sky);
  box-shadow: 0 0 0 3px rgba(74,144,217,.12);
  background: var(--white);
}

.auth-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg,var(--navy-mid),var(--navy));
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  margin-top: 6px;
}

.auth-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.msg {
  font-size: 12px;
  text-align: center;
  margin-top: 12px;
  min-height: 16px;
}

.msg.error { color:#c0392b; }
.msg.success { color:#27ae60; }

#main-screen {
  display: none;
}

.header {
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  padding: 0 28px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 6px rgba(26,58,92,.07);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-logo {
  width: 38px;
  height: 38px;
  object-fit: contain;
}

.header-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.3;
}

.header-title span {
  display: block;
  font-size: 10px;
  font-weight: 400;
  color: var(--gray-400);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-email {
  font-size: 12px;
  color: var(--gray-400);
}

.header-btn {
  background: transparent;
  border: 1.5px solid var(--gray-200);
  color: var(--gray-600);
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}

.header-btn.admin {
  background: var(--navy);
  color: white;
  border-color: var(--navy);
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--gray-200);
}

.section-header::before {
  content:'';
  display:block;
  width:4px;
  height:20px;
  background:linear-gradient(to bottom,var(--sky),var(--navy));
  border-radius:2px;
}

.section-title {
  font-size:14px;
  font-weight:500;
  color:var(--gray-600);
}

.video-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

.video-card-wrap {
  position:relative;
}

.video-card {
  background:var(--white);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  text-decoration:none;
  color:inherit;
  display:block;
  border:1px solid var(--gray-200);
}

.video-card.locked {
  cursor:default;
}

.thumbnail-wrap {
  position:relative;
  width:100%;
  padding-top:56.25%;
  background:var(--gray-200);
  overflow:hidden;
}

.thumbnail-wrap img {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.video-card.locked .thumbnail-wrap img {
  filter:brightness(.5);
}

.play-icon {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:48px;
  height:48px;
  background:rgba(26,58,92,.82);
  border-radius:50%;
}

.play-icon::after {
  content:'';
  position:absolute;
  top:50%;
  left:52%;
  transform:translate(-50%,-50%);
  border-style:solid;
  border-width:8px 0 8px 16px;
  border-color:transparent transparent transparent white;
}

.lock-icon {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:32px;
}

.lock-badge {
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.75);
  color:white;
  font-size:11px;
  padding:3px 10px;
  border-radius:20px;
  white-space:nowrap;
}

.video-info {
  padding:14px 16px 16px;
}

.video-title {
  font-size:14px;
  font-weight:700;
  line-height:1.5;
}

.video-desc {
  font-size:12px;
  color:var(--gray-400);
  line-height:1.6;
  margin-top:6px;
}

.video-date {
  font-size:11px;
  color:var(--gray-400);
  margin-top:10px;
}

.card-delete-btn {
  display:none;
  position:absolute;
  top:8px;
  right:8px;
  background:#c0392b;
  color:white;
  border:none;
  border-radius:6px;
  padding:5px 10px;
  z-index:10;
}

body.is-admin .card-delete-btn {

}

.loading {

}

.text-link {
  display:block;
  text-align:center;
  color:var(--sky);
  font-size:13px;
  margin-top:18px;
  cursor:pointer;
}

.contact-note {
  font-size:12px;
  color:var(--gray-400);
  text-align:center;
  margin-top:12px;
  line-height:1.7;
}

.contact-note a {

}

.contract-badge {

  align-items:center;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}

.contract-badge.active {

  background:#e9f7ef;
  color:#237a45;
  border:1px solid #c9ead6;
}

.contract-badge.paused {

  background:#fff6df;

}

.contract-badge.ended {

.content-switch {

.article-date {

}

.article-menu {

  gap:16px;
  margin:18px 0;
}

.article-menu.show {

}

.article-menu-card {

  border:1px solid #dfe6ef;
  border-radius:12px;
  padding:22px;
  text-align:left;

}

.article-menu-card h3 {

}

.article-menu-card p {

  font-size:13px;
  line-height:1.7;
}

.article-back {

  margin:8px 0 14px;
  background:none;
  border:0;
  color:#315b94;
  cursor:pointer;
  font-weight:700;
}

.article-back.show {

}

#article-modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(26,58,92,.45);
  z-index:250;

  justify-content:center;

.article-modal-card {

.article-modal-top {

.article-modal-title {

.article-close {

.article-body {

.article-source {

@media(max-width:700px) {

@media(max-width:600px) {

/* 2026-09-22: Notion記事・バックナンバー表示 */

/* Notion viewer */

.article-body code { font-family: monospace; }
.notion-callout { margin:1em 0; padding:14px 16px; background:var(--sky-light); border-radius:10px; }
.notion-image { max-width:100%; height:auto; border-radius:8px; margin:1em 0; }
.article-body a { color:var(--sky); text-decoration:underline; overflow-wrap:anywhere; }

</style>
</head>

<script>

// ---- Notion記事リンク対応（2026-09-22） ----
function getNotionArticleUrl(article) {
  return String(
    article?.notion_article_url ||
    article?.notion_url ||
    article?.notion_page_url ||
    ""
  ).trim();
}

function canOpenContractArticle() {
  if (currentUser?.email === ADMIN_EMAIL) return true;
  const status = String(currentProfile?.contract_status || "").trim();
  return status === "契約中";
}

function openNotionArticle(article) {
  const url = getNotionArticleUrl(article);
  if (!url) return false;

  if (!canOpenContractArticle()) {
    if (typeof openLockModal === "function") openLockModal();
    return true;
  }

  // Notion側のゲスト権限が最終的な閲覧制御になります。
  window.open(url, "_blank", "noopener,noreferrer");
  return true;
}


const SUPABASE_URL =

function normalizeAudience(v){

const s=
String(v||"")
.trim()
.toLowerCase();

if([
"医師",
"医師向け",
"doctor",
"doctors"
].includes(s))
return "doctor";

if([
"事務",
"事務向け",
"staff",
"office",
"admin"
].includes(s))
return "staff";

if([
"全員",
"共通",
"all",
"both"
].includes(s))
return "all";

return s||"all";

}

function canReadArticle(a){

if(currentUser?.email===ADMIN_EMAIL)
return true;

const st=currentProfile?.contract_status||"未契約";
const ut=String(currentProfile?.user_type||"");
const aud=normalizeAudience(a.target_audience);

if(st==="契約終了")
return false;

if(ut==="医師")
return aud==="doctor" || aud==="all";

if(ut==="事務")
return aud==="staff" || aud==="all";

return false;

}

return false;

function esc(s){

return String(s)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}


function renderNotionBlocks(blocks){
  if(!Array.isArray(blocks) || !blocks.length) return "本文が登録されていません。";

  const richText = (arr=[]) => arr.map(r => {
    const text = esc(r?.plain_text ?? r?.text?.content ?? "");
    const href = r?.href || r?.text?.link?.url;
    let out = href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${text}</a>` : text;
    const a=r?.annotations||{};
    if(a.bold) out=`<strong>${out}</strong>`;
    if(a.italic) out=`<em>${out}</em>`;
    if(a.underline) out=`<u>${out}</u>`;
    if(a.strikethrough) out=`<s>${out}</s>`;
    if(a.code) out=`<code>${out}</code>`;
    return out;
  }).join("");

  const render = b => {
    const t=b?.type; const x=b?.[t]||{}; const txt=richText(x.rich_text);
    if(t==="paragraph") return txt ? `<p>${txt}</p>` : `<p><br></p>`;
    if(t==="heading_1") return `<h2>${txt}</h2>`;
    if(t==="heading_2") return `<h3>${txt}</h3>`;
    if(t==="heading_3") return `<h4>${txt}</h4>`;
    if(t==="bulleted_list_item") return `<ul><li>${txt}</li></ul>`;
    if(t==="numbered_list_item") return `<ol><li>${txt}</li></ol>`;
    if(t==="quote") return `<blockquote>${txt}</blockquote>`;
    if(t==="callout") return `<div class="notion-callout">${txt}</div>`;
    if(t==="divider") return `<hr>`;
    if(t==="code") return `<pre><code>${txt}</code></pre>`;
    if(t==="image"){ const u=x?.file?.url||x?.external?.url; return u?`<img class="notion-image" src="${esc(u)}" alt="">`:""; }
    if(t==="bookmark" && x.url) return `<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></p>`;
    return txt ? `<p>${txt}</p>` : "";
  };
  return blocks.map(render).join("");
}

function linkifyText(text){

  const escaped=esc(text);

  return escaped.replace(
    /(https?:\/\/[^\s<]+)/g,
    (url)=>{
      let cleanUrl=url;
      let trailing="";

      while(/[。、，．,.!！?？)）\]】」』〉》]$/.test(cleanUrl)){
        trailing=cleanUrl.slice(-1)+trailing;
        cleanUrl=cleanUrl.slice(0,-1);
      }

      return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" style="color:var(--sky);text-decoration:underline;overflow-wrap:anywhere;">${cleanUrl}</a>${trailing}`;
    }
  );

}


function fmtDate(d){

const dt=
new Date(d);

return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;

}
